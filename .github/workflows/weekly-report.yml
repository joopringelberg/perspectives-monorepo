name: Weekly Progress Report

on:
  schedule:
    - cron: '0 15 * * 2'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-report-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
      contents: read
    
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create report issue from PRs and commits
        uses: actions/github-script@v7
        with:
          script: |
            const { createWeeklyReport } = require('./.github/scripts/weekly-report.cjs');
            await createWeeklyReport({ github, context });