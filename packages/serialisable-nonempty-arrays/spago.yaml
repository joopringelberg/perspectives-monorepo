    - simple-json
    - transformers
workspace:
  buildOpts:
    censorLibraryWarnings: all
    statVerbosity: no-stats
  packageSet:
    registry: 60.6.0
  extraPackages:
    perspectives-utilities:
      path: ../perspectives-utilities
      # git: https://github.com/joopringelberg/perspectives-utilities.git
      # ref: v2.0.0
