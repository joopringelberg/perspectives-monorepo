package:
  name: serializablenonemptyarray
  build:
    censorProjectWarnings: all
  test:
    main: Test.Main
    censorTestWarnings: all
    dependencies: []
  dependencies:
    - arrays
    - console
    - effect
    - either
    - foldable-traversable
    - foreign
    - lists
    - maybe
    - newtype
    - perspectives-utilities
