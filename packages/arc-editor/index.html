<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARC editor</title>
    <link rel="stylesheet" href="./src/editor.css" />
  </head>
  <body>
    <header id="toolbar">
      <div id="identity"><strong id="model">…</strong> <span id="filename"></span></div>
      <div id="settings" title="Manifest settings (read-only here; change them on the manifest screen in MyContexts)"></div>
      <span id="dirty" class="badge"></span>
      <span id="saveStatus" class="badge"></span>
      <button id="save" type="button" disabled title="Save (Ctrl/Cmd+S)">Save</button>
    </header>
    <div id="notice" role="alert" hidden></div>
    <main id="editor"></main>
    <section id="feedbackPanel" aria-label="ArcFeedback">
      <h2>ArcFeedback <span id="feedbackKind" class="badge"></span></h2>
      <pre id="feedback">No feedback yet.</pre>
    </section>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
