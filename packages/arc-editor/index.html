<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARC editor</title>
    <link rel="stylesheet" href="./src/editor.css" />
  </head>
  <body>
    <header id="toolbar">
      <div id="identity"><strong id="model">…</strong> <span id="filename"></span></div>
      <div id="settings" title="Manifest settings (read-only here; change them on the manifest screen in MyContexts)"></div>
      <span id="dirty" class="badge"></span>
      <span id="saveStatus" class="badge"></span>
      <button id="back" type="button" disabled title="Back (Alt+Left)">← Back</button>
      <button id="forward" type="button" disabled title="Forward (Alt+Right)">Forward →</button>
      <button id="save" type="button" disabled title="Save (Ctrl/Cmd+S)">Save</button>
    </header>
    <div id="notice" role="alert" hidden></div>
    <div id="panes">
      <div id="workspace">
        <main id="editor"></main>
        <aside id="membersPanel" hidden aria-label="Members">
          <h2><span id="membersTitle"></span> <button id="membersClose" type="button" title="Close">×</button></h2>
          <ul id="membersList"></ul>
        </aside>
      </div>
      <div id="feedbackSplitter" role="separator" tabindex="0" aria-label="Resize feedback pane" aria-orientation="horizontal" aria-controls="feedbackPanel" title="Drag to resize feedback; use Up/Down, Home/End when focused"></div>
      <section id="feedbackPanel" aria-label="ArcFeedback">
        <h2>ArcFeedback <span id="feedbackKind" class="badge"></span></h2>
        <pre id="feedback">No feedback yet.</pre>
      </section>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
