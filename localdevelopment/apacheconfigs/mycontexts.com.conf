<VirtualHost *:80>
    ServerName mycontexts.com
    ServerAlias www.mycontexts.com

    Redirect permanent / https://mycontexts.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName mycontexts.com
    ServerAlias www.mycontexts.com

    ErrorLog "/tmp/mycontexts-error.log"
    CustomLog "/tmp/mycontexts-access.log" combined

    SSLEngine on
    SSLCertificateFile "/Applications/MAMP/conf/apache/ssl/perspectives-local-domains.pem"
    SSLCertificateKeyFile "/Applications/MAMP/conf/apache/ssl/perspectives-local-domains-key.pem"

    RedirectMatch 302 "^/$" "/www/"
    Alias "/www/" "/Applications/MAMP/htdocs/mycontexts-www/"

    <Directory "/Applications/MAMP/htdocs/mycontexts-www">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    AddType application/json .map

    <Location "/models/">
        <LimitExcept GET OPTIONS>
            Require all denied
        </LimitExcept>
        ProxyPass "http://127.0.0.1:5984/models/"
        ProxyPassReverse "http://127.0.0.1:5984/models/"
        Header edit Set-Cookie (.*) "$1; Secure"
    </Location>

    # RabbitMQ management API, used directly for account administration.
    <Location "/rbmq/">
        ProxyPass "http://localhost:15672/"
        ProxyPassReverse "http://localhost:15672/"
    </Location>

    # perspectives-rabbitmq-service: self-registration relay for new RabbitMQ users.
    <Location "/rbsr/">
        # Handle OPTIONS requests (preflight requests)
        <If "%{REQUEST_METHOD} == 'OPTIONS'">
            SetHandler default-handler
            Require all granted
            RewriteEngine On
            RewriteRule ^ - [R=204,L]
        </If>
        ProxyPass "http://localhost:5988"
        ProxyPassReverse "http://localhost:5988"
    </Location>

    # perspectives-sharedfilestorage: Mega.nz relay for shared media files.
    <Location "/ppsfs">
        ProxyPass "http://localhost:15680/ppsfs"
        ProxyPassReverse "http://localhost:15680/ppsfs"
    </Location>

    # Apache won't send these headers for the OPTIONS request handled with SetHandler above,
    # so they must be set unconditionally at the VirtualHost level instead of inside /rbsr/.
    <IfModule mod_headers.c>
        Header always set Access-Control-Allow-Origin "https://mycontexts.com"
        Header always set Access-Control-Allow-Methods "GET, POST, OPTIONS"
        Header always set Access-Control-Allow-Headers "Content-Type, Authorization, Accept"
        Header always set Access-Control-Allow-Credentials "true"
        Header always set Access-Control-Expose-Headers "Content-Type, Cache-Control, Accept-Ranges, ETag, Server, Accept"
        Header always set Access-Control-Max-Age "3600"
    </IfModule>
</VirtualHost>

