<VirtualHost *:80>
    ServerName perspectives.domains
    ServerAlias *.perspectives.domains
    RedirectMatch permanent "(.*)" "https://perspectives.domains$1"
</VirtualHost>

<VirtualHost *:443>
  ServerAdmin joop.ringelberg@perspect.it
  ServerName perspectives.domains
  ServerAlias *.perspectives.domains
#  LogLevel alert rewrite:trace8
  ErrorLog "/tmp/perspectives.domains-error.log"
  CustomLog "/tmp/perspectives.domains-access.log" combined

 #### OPTIONS REQUESTS REWRITING
  #  Couchdb does not handle OPTIONS requests or at least not in the way we need it.
  #  Therefore, we handle all preflight requests here.
  #  We redirect an OPTIONS request to the default index.html, while stipulating that
  #  the response has the 204 (no content) code.
  #  We also add all the required headers and make sure that there are no doubles
  #  by first removing any existing values.

  RewriteEngine On

  # PROTECTING READ DATABASES FROM CURL ETC
#  RewriteCond expr "(%{REQUEST_METHOD} =~ /(PUT|POST|DELETE)/) && (%{REQUEST_URI} =~ m#(cw_|models_).*/.+$# ) && (%{REQUEST_URI} !~ /.*(_write|_security|_design).*/)"
#  RewriteRule ^/.*$  index.html  [R=404]

  # OPTIONS HANDLING
  RewriteCond %{REQUEST_METHOD} ^(OPTIONS)$
  RewriteRule ^/.*$  index.html  [R=204]

  ProxyPassMatch "^/_data(.*)$" "http://127.0.0.1:5984/$1"

  ProxyPassMatch "^(?!.*index\.html)(.*)$" "http://127.0.0.1:5984/$1"
  Header edit Set-Cookie (.*) "$1; Secure; Domain=perspectives.domains; SameSite=None; Partitioned;"

  #### RESPONSE HEADERS

  Header unset Access-Control-Allow-Credentials
  Header unset Access-Control-Allow-Methods
  Header unset Access-Control-Allow-Origin
  Header unset Access-Control-Allow-Headers

  Header always set Access-Control-Allow-Credentials "true"

 # <If "(%{REQUEST_URI} =~ m#(cw_|models_).*/.+$# ) && (%{REQUEST_URI} !~ /.*(_write|_security|_design).*/)">
 #   Header always Set Access-Control-Allow-Methods "GET, OPTIONS"
 # </If>
 # <Else>
    Header always Set Access-Control-Allow-Methods "GET, PUT, POST, DELETE, OPTIONS"
 # </Else>

#  Header always set Access-Control-Allow-Origin https://mycontexts.com
<IfModule mod_headers.c>
    SetEnvIf Origin "^http://localhost:5177$" ORIGIN_ALLOWED=$0
    SetEnvIf Origin "^https://localhost:5177$" ORIGIN_ALLOWED=$0
    SetEnvIf Origin "^https://mycontexts.com$" ORIGIN_ALLOWED=$0
    SetEnvIf Origin "^https://192.168.2.24:5177$" ORIGIN_ALLOWED=$0
    Header always set Access-Control-Allow-Origin "%{ORIGIN_ALLOWED}e" env=ORIGIN_ALLOWED
</IfModule>

  Header always set Access-Control-Allow-Headers "content-type"

<If "%{REQUEST_URI} !~ m#^/(models_|_data)# && %{REQUEST_URI} =~ m#/_all_docs$#">
    Redirect 403
</If>


  SSLEngine on
  SSLCertificateFile "/Applications/MAMP/conf/apache/ssl/perspectives-local-domains.pem"
  SSLCertificateKeyFile "/Applications/MAMP/conf/apache/ssl/perspectives-local-domains-key.pem"
</VirtualHost>

### COUCHDB ADMIN AND REPOREPLICATION ENDPOINT
### The server should have a firewall configuration that restricts access to this port
### to a few IP adresses, as one can access all of Couchdb via this Virtualhost.
<VirtualHost 127.0.0.1:5987>
  ServerName perspectives.domains
   ServerAlias *.perspectives.domains
  ProxyPass / http://127.0.0.1:5984/

   SSLEngine on
  SSLCertificateFile "/Applications/MAMP/conf/apache/ssl/perspectives-local-domains.pem"
  SSLCertificateKeyFile "/Applications/MAMP/conf/apache/ssl/perspectives-local-domains-key.pem"
   Header edit Set-Cookie (.*) "$1; Secure"
</VirtualHost>




