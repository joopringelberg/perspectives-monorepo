<VirtualHost *:80>
    ServerName joopringelberg.nl
    ServerAlias www.joopringelberg.nl

    Redirect permanent / https://joopringelberg.nl/
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin joop.ringelberg@gmail.com
    ServerName joopringelberg.nl
    ServerAlias www.joopringelberg.nl

    ErrorLog "/tmp/joopringelberg-nl-error.log"
    CustomLog "/tmp/joopringelberg-nl-access.log" combined

    ProxyPassMatch "^/(_data|_session|.*_design|cw_|models_)(.*$)" "http://127.0.0.1:5984/$1$2"
    ProxyPassReverseCookieDomain perspectives.domains joopringelberg.nl

    SSLEngine on
    SSLCertificateFile "/Applications/MAMP/conf/apache/ssl/perspectives-local-domains.pem"
    SSLCertificateKeyFile "/Applications/MAMP/conf/apache/ssl/perspectives-local-domains-key.pem"
</VirtualHost>




